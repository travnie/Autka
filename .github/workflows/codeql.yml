name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
#  schedule:
#    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  # Keyed by event too: a pending (not yet running) scheduled scan can
  # still be dequeued by a later push sharing the same group, even though
  # cancel-in-progress below only applies to already-running jobs.
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-slim
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-slim
          - language: java-kotlin
            build-mode: manual
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The java-kotlin database can only be built by actually compiling
      # app/, since CodeQL's autobuilder can't do this for an Android app
      # on its own. This reuses android-ci.yml's build steps, but the
      # build/configuration caches are disabled below for tracing
      # correctness, so this leg always compiles from scratch and is
      # slower than a normal cached Android build.
      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # CodeQL's tracer only sees code that is actually compiled while it's
      # attached, so the build and configuration caches are disabled here -
      # a cache hit would let compileKotlin/compileJava skip javac/kotlinc
      # entirely and the java-kotlin database would come back empty, passing
      # green while silently analysing nothing.
      - name: Build app (debug)
        if: matrix.language == 'java-kotlin'
        run: ./gradlew assembleDebug --no-daemon --no-build-cache --no-configuration-cache --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:${{ matrix.language }}"
