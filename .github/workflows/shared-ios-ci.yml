name: Shared iOS CI

on:
  push:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/**'
      - '.github/workflows/shared-ios-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/**'
      - '.github/workflows/shared-ios-ci.yml'
  workflow_dispatch:

concurrency:
  group: shared-ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-slim
    outputs:
      intel: ${{ steps.diff.outputs.intel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select Intel tests
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          intel=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
              if git diff --quiet "$BASE_SHA" HEAD -- shared/ build.gradle.kts settings.gradle.kts gradle.properties \
                gradlew gradlew.bat gradle/ .github/workflows/shared-ios-ci.yml; then
                intel=false
              fi
            fi
          fi
          echo "intel=$intel" >> "$GITHUB_OUTPUT"

  arm64:
    name: Build & test shared iOS (arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build XCFramework and run iOS tests
        run: >-
          ./gradlew --no-daemon --stacktrace
          :shared:assembleAutkaSharedDebugXCFramework
          :shared:iosSimulatorArm64Test

      - name: Build native iOS app
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload debug XCFramework
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AutkaShared-debug-xcframework
          path: shared/build/XCFrameworks/debug
          if-no-files-found: error

  x64:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.intel != 'false') }}
    name: Build & test shared iOS (x64)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run iOS tests
        run: ./gradlew --no-daemon --stacktrace :shared:iosX64Test
