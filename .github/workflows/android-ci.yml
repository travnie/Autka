name: Android CI

on:
  push:
    branches: [ main ]
    # Backend-, docs- and iOS-only changes can't affect the Android build, so skip them.
    paths-ignore: [ 'backend/**', 'iosApp/**', '**/*.md', 'docs/**', 'LICENSE', '.github/workflows/backend-ci.yml', '.github/workflows/shared-ios-ci.yml' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ 'backend/**', 'iosApp/**', '**/*.md', 'docs/**', 'LICENSE', '.github/workflows/backend-ci.yml', '.github/workflows/shared-ios-ci.yml' ]
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle (v4+) validates the gradle-wrapper.jar checksum automatically
      # on every run and handles Gradle dependency/build caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # roborazzi.test.record: the unit-test run also writes JVM screenshots (ScreenshotTest).
      - name: Lint, build and unit test
        run: |
          ./gradlew --no-daemon --stacktrace lintDebug assembleDebug testDebugUnitTest \
            :shared:testAndroidHostTest -Proborazzi.test.record=true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload JVM screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: autka-screenshots-jvm
          path: app/build/outputs/roborazzi/*.png
          retention-days: 14
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  emulator-smoke:
    # Real-device check the JVM screenshots can't give (Hilt graph, MapLibre native init, real
    # network): cold-start the debug APK on Android 16, fail if the process dies or logs a
    # crash, keep a screenshot, UI dump and logcat.
    name: Emulator smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-debug-apk
          path: apk

      - name: Launch on emulator
        # aistee's composite action: KVM + cached AVD snapshot.
        uses: travnie/aistee/.github/actions/run-android-emulator@0d4aa44faf46fb716738b170452410fcc2371ede
        with:
          avd-name: autka-ci
          # uiautomator dump and logcat -d flake on a fresh emulator (null root node, exit 255): retry.
          script: |
            mkdir -p out
            adb install -r -g "$(ls apk/*.apk | head -1)"
            adb logcat -c
            adb shell am start -W -n com.autka/.MainActivity
            sleep 10
            adb exec-out screencap -p > out/listings.png
            for i in 1 2 3; do adb shell uiautomator dump /sdcard/ui.xml | grep -q dumped && break; sleep 3; done
            adb pull /sdcard/ui.xml out/ui.xml
            adb shell pidof com.autka
            adb logcat -d > out/logcat.txt || { sleep 3; adb logcat -d > out/logcat.txt; }

      - name: Check crashes and first screen
        # pidof above already fails if the process died (Java or native). Here: no crash record
        # for com.autka, and the listings screen (search field, en-US emulator) is on screen.
        run: |
          if grep -E "^(--------- beginning of crash|.*(FATAL EXCEPTION|Fatal signal))" -A3 out/logcat.txt | grep -q com.autka; then
            echo "::error::com.autka crashed, see logcat.txt"; exit 1
          fi
          grep -q 'package="com.autka"' out/ui.xml || { echo "::error::Autka not in foreground"; exit 1; }
          grep -q 'Search make, model' out/ui.xml || { echo "::error::listings search field not shown"; exit 1; }

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: autka-screenshots-emulator
          path: out/
          retention-days: 14
          if-no-files-found: warn
