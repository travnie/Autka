# Autka rolling release workflow.
name: 小车

on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build and publish rolling release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: autka-rolling-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select release scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            lookup_err="$RUNNER_TEMP/release-scope.err"
            if published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/autka-latest" --jq 'if .draft then "" else (.id | tostring) end' 2>"$lookup_err")"; then
              if [ -n "$published" ]; then
                old_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/autka-latest" --jq .object.sha)"
                git cat-file -e "$old_sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$old_sha"
                if git diff --quiet "$old_sha" HEAD -- app/ shared/ gradle/ gradlew gradlew.bat build.gradle.kts \
                  settings.gradle.kts gradle.properties .github/workflows/release.yml; then
                  required=false
                fi
              fi
            elif ! grep -q 'HTTP 404' "$lookup_err"; then
              cat "$lookup_err" >&2
              exit 1
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

      - name: Resolve app version
        if: steps.scope.outputs.required == 'true'
        id: release
        run: |
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$version" ]; then
            echo "::error::app/build.gradle.kts has no versionName."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.scope.outputs.required == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.scope.outputs.required == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Validate signing secrets
        if: steps.scope.outputs.required == 'true'
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          check_store="$RUNNER_TEMP/release-check.p12"
          check_password="$(openssl rand -hex 24)"
          valid=false

          for source_type in PKCS12 JKS; do
            if keytool -importkeystore \
              -srckeystore "$keystore" \
              -srcstoretype "$source_type" \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -srckeypass "$KEY_PASSWORD" \
              -destkeystore "$check_store" \
              -deststoretype PKCS12 \
              -deststorepass "$check_password" \
              -destkeypass "$check_password" \
              -noprompt >/dev/null 2>&1; then
              valid=true
              break
            fi
          done

          rm -f "$check_store"
          if [ "$valid" != true ]; then
            echo "::error::Release keystore, alias, or passwords do not match."
            exit 1
          fi
          echo "path=$keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK and AAB
        if: steps.scope.outputs.required == 'true'
        env:
          AUTKA_KEYSTORE: ${{ steps.keystore.outputs.path }}
          AUTKA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AUTKA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AUTKA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify and name release artifacts
        if: steps.scope.outputs.required == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt2" dump badging "$apk" | grep -F "versionName='$RELEASE_VERSION'"
          aab_files="$RUNNER_TEMP/aab-files.txt"
          unzip -Z1 "$aab" > "$aab_files"
          grep -Eq '^META-INF/.*\.(RSA|DSA|EC)$' "$aab_files"
          jarsigner -verify "$aab" >/dev/null

          cp "$apk" dist/autka.apk
          cp "$aab" dist/autka.aab

      - name: Publish rolling release
        if: steps.scope.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="autka-latest"
          # Manual recovery after rewritten history is allowed only from current main.
          recover=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            current="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
            if [ "$current" = "$GITHUB_SHA" ]; then recover=true; fi
          fi
          # Reject automatic builds removed from main, including stale reruns after rewinds.
          if [ "$recover" != true ]; then
            current_relation="$(gh api "repos/$GH_REPO/compare/$GITHUB_SHA...main" --jq .status)"
            if [ "$current_relation" != ahead ] && [ "$current_relation" != identical ]; then
              echo "::warning::Build is no longer on main; skipping stale release."
              exit 0
            fi
          fi
          check_candidate() {
            local baseline="$1" relation
            [ -n "$baseline" ] || return 0
            relation="$(gh api "repos/$GH_REPO/compare/$GITHUB_SHA...$baseline" --jq .status)" || exit 1
            if [ "$relation" = ahead ] && [ "$recover" != true ]; then
              echo "A newer verified or published build exists; skipping stale release."
              exit 0
            fi
            if [ "$relation" = diverged ] && [ "$recover" != true ]; then
              echo "::error::History diverged; dispatch release on current main for recovery."
              exit 1
            fi
          }
          lookup_err="$RUNNER_TEMP/rolling-tag.err"
          if published_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>"$lookup_err")"; then
            check_candidate "$published_sha"
          elif ! grep -q 'HTTP 404' "$lookup_err"; then
            cat "$lookup_err" >&2
            exit 1
          fi
          # A newer verified main run supersedes old reruns; an untested push does not.
          endpoint="repos/$GH_REPO/actions/workflows/android-ci.yml/runs"
          verified="$(gh api "$endpoint?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"
          # A successful run from removed main history must not block recovery forever.
          # Only a verified commit still reachable from current main can supersede this build.
          if [ -n "$verified" ]; then
            verify_err="$RUNNER_TEMP/verified-history.err"
            if verified_relation="$(gh api "repos/$GH_REPO/compare/$verified...main" --jq .status 2>"$verify_err")"; then
              if [ "$verified_relation" = ahead ] || [ "$verified_relation" = identical ]; then
                check_candidate "$verified"
              fi
            elif ! grep -q 'HTTP 404' "$verify_err"; then
              cat "$verify_err" >&2
              exit 1
            fi
          fi

          cat > release-notes.md <<EOF
          Signed Android builds from \`${GITHUB_SHA}\`.

          Rolling release. Assets are replaced after each successful build of \`main\`.
          App version: \`${RELEASE_VERSION}\`.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            # Hide incomplete asset sets; a failed retry remains a recoverable draft.
            gh release edit "$tag" --draft --title "Autka · rolling" --notes-file release-notes.md
          else
            gh release create "$tag" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Autka · rolling" \
              --notes-file release-notes.md
          fi

          gh release upload "$tag" \
            dist/autka.apk \
            dist/autka.aab \
            --clobber
          lookup_err="$RUNNER_TEMP/rolling-tag.err"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>"$lookup_err"; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
          elif grep -q 'HTTP 404' "$lookup_err"; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          else
            cat "$lookup_err" >&2
            exit 1
          fi
          gh release edit "$tag" --draft=false --latest

          gh release delete v0.0.2 --yes 2>/dev/null || true
